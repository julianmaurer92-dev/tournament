<!DOCTYPE html>
<html lang="de"
      data-theme="{{ cp_theme }}"
      data-schema="{{ cp_schema }}"
      {% if cp_vereinsfarbe %}data-vereinsfarbe="an"{% endif %}>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="{{ 'light' if cp_schema == 'hell' else 'dark' }}">
    <title>{% block title %}Turnier{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/inter.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bausteine.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {# Vereinsfarbe: ueberschreibt den Theme-Akzent. Die Schriftfarbe darauf
       entscheidet der Kontrast, siehe app/farben.py. #}
    {% if cp_vereinsfarbe %}
    <style id="vereinsfarbe">:root { {{ cp_vereinsfarbe }} }</style>
    {% endif %}
    {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    <a class="cp-sprung" href="#inhalt">Zum Inhalt springen</a>
    {% block content %}{% endblock %}
    <div class="cp-toasts" id="cp-toasts" role="status" aria-live="polite"></div>
    <script src="{{ url_for('static', filename='js/cp-basis.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
