[pytest]
testpaths = tests
python_files = test_*.py
# tests/e2e laeuft im Playwright-Container mit eigener Konfiguration
# (pytest-e2e.ini). Hier wuerde es nur Sammelfehler erzeugen.
addopts = -ra --strict-markers --ignore=tests/e2e
markers =
    e2e: End-to-End-Tests mit Playwright (brauchen eine laufende Dev-Instanz)
