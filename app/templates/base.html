<!DOCTYPE html>
<html lang="de" data-theme="{{ site_settings.theme or 'dark' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Turnier{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/inter.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {# Dynamic CSS custom properties from DB settings #}
    <style id="dynamic-theme">
        :root {
            --color-primary:   {{ site_settings.color_primary }};
            --color-secondary: {{ site_settings.color_secondary }};
            --color-title:     {{ site_settings.color_title }};
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    {% block content %}{% endblock %}
    {% block scripts %}{% endblock %}
</body>
</html>
